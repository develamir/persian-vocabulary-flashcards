<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Flashcards کلمات فارسی</title>
<style>
  body {font-family: sans-serif; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f0f4f8; color:#333;}
  .card {background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); padding:2rem 3rem; text-align:center; max-width:400px; width:100%;}
  .word {font-size:2.5rem; margin-bottom:1rem; direction:rtl;}
  .translation {font-size:1.5rem; color:#0066cc; display:none; margin-top:1rem;}
  button {margin-top:1.5rem; padding:0.5rem 1rem; font-size:1rem; cursor:pointer; background:#0066cc; color:#fff; border:none; border-radius:4px;}
  button:hover {background:#004c99;}
  .controls {display:flex; justify-content:space-between; width:100%; margin-top:1rem;}
</style>
</head>
<body>
<div class="card">
  <div class="word" id="word">کلمه</div>
  <div class="translation" id="translation">ترجمه</div>
  <div class="controls">
    <button id="nextBtn">درباره</button>
    <button id="resetBtn">بازگشت</button>
  </div>
</div>
<script>
const data = [
  {"fa":"کتاب","en":"book"},
  {"fa":"پنچ","en":"pen"},
  {"fa":"آب","en":"water"},
  {"fa":"ساعت","en":"clock"},
  {"fa":"خانه","en":"house"},
  {"fa":"دست","en":"hand"},
  {"fa":"چراغ","en":"lamp"},
  {"fa":"کودک","en":"child"},
  {"fa":"مدرسه","en":"school"},
  {"fa":"غذا","en":"food"}
];
let index = 0;
const wordEl = document.getElementById('word');
const translationEl = document.getElementById('translation');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
function showWord() {
  const item = data[index];
  wordEl.textContent = item.fa;
  translationEl.style.display = 'none';
}
function revealTranslation() {
  const item = data[index];
  translationEl.style.display = 'block';
}
nextBtn.addEventListener('click', () => {
  index = (index + 1) % data.length;
  showWord();
});
resetBtn.addEventListener('click', () => {
  index = 0;
  showWord();
});
showWord();
</script>
</body>
</html>
